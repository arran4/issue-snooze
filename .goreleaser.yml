version: 2
project_name: snooze-bot

builds:
  - id: linux-amd64
    main: ./cmd/snoozebot
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
  - id: linux-arm64
    main: ./cmd/snoozebot
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64

dockers_v2:
  - images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64

nfpms:
  - id: linux-packages
    package_name: snooze-bot
    vendor: Your Org
    homepage: https://github.com/issue-snooze/snooze-bot
    maintainer: You <you@example.com>
    description: Issue snooze bot
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
