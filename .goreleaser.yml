version: 2
project_name: issue-snooze

builds:
  - id: linux-amd64
    main: ./cmd/issue-snooze
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
  - id: linux-arm64
    main: ./cmd/issue-snooze
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64

dockers_v2:
  - images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64

nfpms:
  - id: linux-packages
    package_name: issue-snooze
    vendor: Arran4
    homepage: https://github.com/arran4/issue-snooze
    maintainer: Arran4 <arran4@users.noreply.github.com>
    description: Issue snooze bot
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
