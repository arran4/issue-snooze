name: PR release validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Generator, release and container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native and cross C toolchains
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-aarch64-linux-gnu
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Verify generated CLI is stable
        shell: bash
        run: |
          set -euo pipefail
          go generate ./cmd/...
          git diff --exit-code
          go generate ./cmd/...
          git diff --exit-code

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Build non-publishing release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,docker
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build and smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux/amd64 .smoke-data
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o linux/amd64/issue-snooze ./cmd/issue-snooze
          docker build --build-arg TARGETPLATFORM=linux/amd64 -t issue-snooze:pr-smoke -f Dockerfile.goreleaser .

          docker run -d --name issue-snooze-smoke -p 18080:8080             -e GITHUB_TOKEN=dummy-token             -e DATABASE_FILE=/data/snooze.db             -v "$PWD/.smoke-data:/data" issue-snooze:pr-smoke
          trap 'docker rm -f issue-snooze-smoke >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if test -f .smoke-data/snooze.db; then
              break
            fi
            sleep 1
          done
          test -f .smoke-data/snooze.db

          docker rm -f issue-snooze-smoke
          docker run -d --name issue-snooze-smoke -p 18080:8080             -e GITHUB_TOKEN=dummy-token             -e DATABASE_FILE=/data/snooze.db             -v "$PWD/.smoke-data:/data" issue-snooze:pr-smoke
          sleep 2
          test -f .smoke-data/snooze.db
